<output id="output"></output>
<!-- https://www.jsdelivr.com/package/npm/markdown -->
<script src="https://cdn.jsdelivr.net/npm/markdown@0.5.0/lib/markdown.min.js"></script>



<script>
    const output = document.getElementById('output');

    ; (async () => {
        // Verifica se a API do Chrome Built-in AI está disponível

        const languageModel = await LanguageModel.availability()
        //  if (languageModel === 'available') {
        console.log('LanguageModel is available')
        const params = await LanguageModel.params()
        console.log(params)
        const temperature = params.defaultTemperature;
        const topK = params.defaultTopK

        const initialPrompts = [
            {
                role: 'system',
                content: 'Você é um assistente de IA que responde de forma clara e objetiva.'
            }
        ];

        const question = 'Quem inventou o JavaScript?';
        const session = await LanguageModel.create({
            expectedInputLanguages: 'en',
            temperature,
            topK,
            initialPrompts,
        })

        const responseStream = await session.promptStreaming(
            [
                {
                    role: 'user',
                    content: question
                }
            ]
        )
        output.innerHTML = "";
        // Forma correta de consumir o stream:
        let fullResponse = "";
        for await (const chunk of responseStream) {
            fullResponse += chunk; // No Window AI atual, o chunk geralmente contém o texto acumulado
            output.innerHTML = markdown.toHTML(fullResponse); // Atualiza o HTML em tempo real
            console.log(chunk);
        }

        //}


    })();

</script>
